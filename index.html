<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Học Tập Tin Học</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:18px 20px}
header h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.9}
.wrap{max-width:1000px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:16px;box-shadow:0 5px 22px #00000012;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}
label{font-weight:bold;font-size:14px;display:block;margin-bottom:6px}
input,select,textarea,button{font:inherit;border:1px solid #d7deea;border-radius:10px;padding:11px}
input,select,textarea{width:100%;background:#fff}textarea{min-height:110px;resize:vertical}
button{cursor:pointer;background:#2563eb;color:#fff;border:0;font-weight:bold}
button:hover{filter:brightness(.95)}button.secondary{background:#64748b}button.green{background:#059669}
.chat{height:430px;overflow:auto;border:1px solid #e1e7f0;border-radius:12px;padding:12px;background:#f8fafc}
.msg{max-width:85%;padding:11px 13px;border-radius:13px;margin:8px 0;white-space:pre-wrap;line-height:1.5}
.user{margin-left:auto;background:#dbeafe}.ai{background:#fff;border:1px solid #e5e7eb}
.small{font-size:13px;color:#64748b}.status{padding:9px;border-radius:9px;background:#f1f5f9;margin-top:10px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
.hidden{display:none}.danger{color:#b91c1c}
</style>
</head>
<body>
<header><h1>🤖 AI Học Tập</h1><p>Trợ lý học tập • C++ • Python • Thuật toán • Tạo bài tập</p></header>

<div class="wrap">
<div class="card">
  <div class="row">
    <div><label>API Key</label><input id="key" type="password" placeholder="Nhập API key của nhà cung cấp AI"></div>
    <div><label>AI Model</label><input id="model" value="gpt-5.6-mini" placeholder="Tên model"></div>
  </div>
  <div class="small" style="margin-top:8px">API key chỉ được lưu trong trình duyệt nếu bạn bấm “Lưu”. Không đưa API key vào mã nguồn khi đăng website công khai.</div>
  <div style="margin-top:10px"><button onclick="saveKey()">💾 Lưu cấu hình</button> <button class="secondary" onclick="clearKey()">Xóa key</button></div>
</div>

<div class="card">
<div class="tabs">
<button onclick="showTab('chat')">💬 Chat AI</button>
<button onclick="showTab('code')">💻 Giải thích code</button>
<button onclick="showTab('exercise')">📝 Tạo bài tập</button>
</div>

<section id="chat">
<div id="chatBox" class="chat">
<div class="msg ai">Xin chào! Tôi là AI Học Tập. Hãy hỏi tôi về C++, Python, thuật toán hoặc các môn học.</div>
</div>
<div style="margin-top:10px">
<textarea id="question" placeholder="Ví dụ: Giải thích vòng lặp for trong Python cho học sinh lớp 8..."></textarea>
<div class="row" style="margin-top:8px">
<select id="level"><option>Học sinh lớp 6</option><option>Học sinh lớp 7</option><option>Học sinh lớp 8</option><option selected>Học sinh lớp 9</option><option>Học sinh giỏi</option><option>Giáo viên</option></select>
<select id="subject"><option>Tin học</option><option>C++</option><option>Python</option><option>Toán</option><option>Khoa học</option><option>Khác</option></select>
</div>
<button style="margin-top:8px;width:100%" onclick="askAI()">🚀 Hỏi AI</button>
</div>
</section>

<section id="code" class="hidden">
<label>Ngôn ngữ</label><select id="lang"><option>C++</option><option>Python</option></select>
<label style="margin-top:10px">Dán code cần giải thích</label>
<textarea id="codeInput" placeholder="Dán code vào đây..."></textarea>
<button style="margin-top:8px;width:100%" onclick="explainCode()">🔍 Giải thích code</button>
<div id="codeResult" class="status hidden"></div>
</section>

<section id="exercise" class="hidden">
<div class="row">
<div><label>Lớp</label><select id="exClass"><option>6</option><option>7</option><option selected>8</option><option>9</option></select></div>
<div><label>Chủ đề</label><select id="exTopic"><option>C++ cơ bản</option><option>Python cơ bản</option><option>Xâu</option><option>Mảng</option><option>Vòng lặp</option><option>Thuật toán</option></select></div>
<div><label>Số bài</label><input id="exNum" type="number" value="5" min="1" max="20"></div>
</div>
<label style="margin-top:10px">Mức độ</label><select id="exLevel"><option>Nhận biết</option><option>Thông hiểu</option><option selected>Vận dụng</option><option>Học sinh giỏi</option></select>
<button style="margin-top:10px;width:100%" onclick="makeExercises()">✨ Tạo bài tập</button>
<div id="exResult" class="status hidden"></div>
</section>
</div>
</div>

<script>
const keyEl=document.getElementById('key'), modelEl=document.getElementById('model');
keyEl.value=localStorage.getItem('ai_key')||'';
modelEl.value=localStorage.getItem('ai_model')||'gpt-5.6-mini';

function saveKey(){localStorage.setItem('ai_key',keyEl.value.trim());localStorage.setItem('ai_model',modelEl.value.trim());alert('Đã lưu cấu hình trên thiết bị này.')}
function clearKey(){localStorage.removeItem('ai_key');keyEl.value='';alert('Đã xóa API key đã lưu.')}
function showTab(t){['chat','code','exercise'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t))}
function addMsg(text,cls){let d=document.createElement('div');d.className='msg '+cls;d.textContent=text;let box=document.getElementById('chatBox');box.appendChild(d);box.scrollTop=box.scrollHeight}

async function callAI(prompt){
 const key=keyEl.value.trim();
 if(!key) throw new Error('Chưa nhập API key.');
 const r=await fetch('https://api.openai.com/v1/responses',{
   method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
   body:JSON.stringify({model:modelEl.value.trim()||'gpt-5.6-mini',input:prompt})
 });
 if(!r.ok){let t=await r.text();throw new Error('API lỗi '+r.status+': '+t)}
 const data=await r.json();
 if(data.output_text)return data.output_text;
 try{return data.output.map(x=>x.content?.map(y=>y.text||'').join('')||'').join('\\n')}catch(e){}
 return JSON.stringify(data);
}
async function askAI(){
 const q=document.getElementById('question').value.trim();if(!q)return;
 addMsg(q,'user');document.getElementById('question').value='';
 addMsg('Đang suy nghĩ...','ai');let box=document.getElementById('chatBox'), wait=box.lastChild;
 try{
  let prompt=`Bạn là trợ lý học tập cho ${document.getElementById('level').value}. Môn/chủ đề: ${document.getElementById('subject').value}.
Giải thích bằng tiếng Việt, dễ hiểu, có ví dụ. Nếu là lập trình, ưu tiên code đơn giản và giải thích từng phần.
Câu hỏi: ${q}`;
  let ans=await callAI(prompt);wait.textContent=ans;
 }catch(e){wait.textContent='❌ '+e.message}
}
async function explainCode(){
 const code=document.getElementById('codeInput').value.trim(), out=document.getElementById('codeResult');if(!code)return;
 out.classList.remove('hidden');out.textContent='Đang phân tích...';
 try{out.textContent=await callAI(`Bạn là giáo viên Tin học THCS. Hãy giải thích đoạn ${document.getElementById('lang').value} sau cho học sinh lớp 8-9. Nêu: 1) code làm gì, 2) giải thích từng phần, 3) lỗi nếu có, 4) cách viết dễ hiểu hơn.\\n\\n${code}`)}
 catch(e){out.textContent='❌ '+e.message}
}
async function makeExercises(){
 const out=document.getElementById('exResult');out.classList.remove('hidden');out.textContent='Đang tạo bài...';
 try{out.textContent=await callAI(`Tạo ${document.getElementById('exNum').value} bài tập lập trình cho học sinh lớp ${document.getElementById('exClass').value}, chủ đề ${document.getElementById('exTopic').value}, mức ${document.getElementById('exLevel').value}. Mỗi bài gồm: đề bài, input, output, ví dụ, gợi ý thuật toán. Không cần lời giải trừ khi được yêu cầu.`)}
 catch(e){out.textContent='❌ '+e.message}
}
</script>
</body>
</html>
